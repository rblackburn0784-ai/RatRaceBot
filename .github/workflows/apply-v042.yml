name: Apply Rat Rod Racing Bot v0.4.2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and apply v0.4.2 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          names = [
              'chunk-000a.b64', 'chunk-000b.b64',
              'chunk-001.b64', 'chunk-002.b64', 'chunk-003.b64', 'chunk-004.b64'
          ]
          paths = [Path('.rr-update') / name for name in names]
          missing = [str(p) for p in paths if not p.exists()]
          if missing:
              raise SystemExit(f'Missing patch chunks: {missing}')
          encoded = ''.join(p.read_text(encoding='utf-8') for p in paths)
          payload = base64.b64decode(encoded, validate=True)
          expected = '4570715e4362abe42f94a0a5e048381c9b7a3c778bc5a028db4f30905ec0040a'
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(f'Patch checksum mismatch: {actual}')
          raw = lzma.decompress(payload)
          raw_expected = 'ef44141b422e1876e0ef03ec16ca6bd8abcef3ca1253b0e5b3aa4b89af03dfbe'
          raw_actual = hashlib.sha256(raw).hexdigest()
          if raw_actual != raw_expected:
              raise SystemExit(f'Raw patch checksum mismatch: {raw_actual}')
          Path('/tmp/v042.patch').write_bytes(raw)
          PY
          git apply --check /tmp/v042.patch
          git apply /tmp/v042.patch

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Verify v0.4.2
        run: |
          python -m compileall -q main.py config.py cogs services storage models data
          pytest -q tests/test_v042_regressions.py

      - name: Commit clean v0.4.2 source
        shell: bash
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          rm -rf .rr-update
          rm -f .github/workflows/apply-v042.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Rat Rod Racing Bot v0.4.2 - Race Rules, Tournament Integrity & Reliability"
          git push origin HEAD:main
