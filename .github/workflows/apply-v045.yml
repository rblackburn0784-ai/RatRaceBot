name: Apply Rat Rod Racing Bot v0.4.5

on:
  push:
    branches: [main]
    paths:
      - '.rr-update/**'
      - '.github/workflows/apply-v045.yml'

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and apply v0.4.5 patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          names = ['chunk-000.b64', 'chunk-001.b64']
          paths = [Path('.rr-update') / name for name in names]
          missing = [str(p) for p in paths if not p.exists()]
          if missing:
              raise SystemExit(f'Missing patch chunks: {missing}')
          for p in paths:
              text = p.read_text(encoding='utf-8')
              print(f'{p}: chars={len(text)} sha256={hashlib.sha256(text.encode()).hexdigest()}')
          encoded = ''.join(p.read_text(encoding='utf-8') for p in paths)
          payload = base64.b64decode(encoded, validate=True)
          expected = '085ebba4394b4063bac0e6c965a9be09ab5dc9f326a9a80e302a84a8c68fed4c'
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(f'Compressed patch checksum mismatch: {actual}')
          raw = lzma.decompress(payload)
          raw_expected = 'fe5a0d016f90ce4781c5fb8756fbda9d33814b94a33699193292655767a6160c'
          raw_actual = hashlib.sha256(raw).hexdigest()
          if raw_actual != raw_expected:
              raise SystemExit(f'Raw patch checksum mismatch: {raw_actual}')
          Path('/tmp/v045.patch').write_bytes(raw)
          PY
          git apply --check /tmp/v045.patch
          git apply /tmp/v045.patch

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify v0.4.5
        run: |
          python -m compileall -q main.py config.py cogs services storage models data tools
          python -m pytest -q
          python tools/balance_lab.py --quick
          grep -q 'v0.4.5' VERSION.txt
          grep -q 'BOT_VERSION = "0.4.5"' config.py

      - name: Commit clean v0.4.5 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .rr-update
          rm -f .github/workflows/apply-v045.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rat Rod Racing Bot v0.4.5 - Garage, Parts & Crew Gameplay'
          git push origin main
