name: Apply Rat Rod Racing Bot v0.4.7

on:
  push:
    branches: [main]
    paths:
      - '.rr-update/READY-v047'

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and apply v0.4.7 patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          parts = [Path(f'.rr-update/part-{i:02d}') for i in range(16)]
          missing = [str(p) for p in parts if not p.exists()]
          if missing:
              raise SystemExit(f'Missing patch parts: {missing}')
          encoded = ''.join(p.read_text(encoding='utf-8') for p in parts)
          payload = base64.b64decode(encoded, validate=True)
          expected = '693768d80bf49cfba4ebc36abc31b71d3c6a2fe5f1d06265e57449ae87a61d9e'
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(f'Compressed patch checksum mismatch: {actual}')
          raw = lzma.decompress(payload)
          raw_expected = '4f6724f68251b24b4e7fba03b40ce3593be86b9892f2f91d12b18d4130d9407c'
          raw_actual = hashlib.sha256(raw).hexdigest()
          if raw_actual != raw_expected:
              raise SystemExit(f'Raw patch checksum mismatch: {raw_actual}')
          Path('/tmp/v047.patch').write_bytes(raw)
          PY
          git apply --check /tmp/v047.patch
          git apply /tmp/v047.patch

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify v0.4.7
        run: |
          python -m compileall -q main.py config.py cogs services storage models data tools
          python -m pytest -q tests/test_v047_championships.py tests/test_v042_regressions.py tests/test_v043_balance.py tests/test_v046_progression.py
          python tools/balance_lab.py --quick
          grep -q 'v0.4.7' VERSION.txt
          grep -q 'BOT_VERSION = "0.4.7"' config.py

      - name: Commit clean v0.4.7 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .rr-update
          rm -f .github/workflows/apply-v047.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rat Rod Racing Bot v0.4.7 - Championships & Season Structure'
          git push origin main
