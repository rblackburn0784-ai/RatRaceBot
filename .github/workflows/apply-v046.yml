name: Apply Rat Rod Racing Bot v0.4.6

on:
  push:
    branches: [main]
    paths:
      - '.rr-update/**'
      - '.github/workflows/apply-v046.yml'

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and apply v0.4.6 patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          encoded = Path('.rr-update/v046.patch.xz.b64').read_text(encoding='utf-8')
          payload = base64.b64decode(encoded, validate=True)
          expected = '9b45a5d95eb371ad798453ceea5ce9ce446530c8e6706e1f8fd5161acfb2093b'
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(f'Compressed patch checksum mismatch: {actual}')
          raw = lzma.decompress(payload)
          raw_expected = '33db3bc921413c1ed645869a0daa3f1eb676eb1a5ecb8bbeee72f4f09f08e5d1'
          raw_actual = hashlib.sha256(raw).hexdigest()
          if raw_actual != raw_expected:
              raise SystemExit(f'Raw patch checksum mismatch: {raw_actual}')
          Path('/tmp/v046.patch').write_bytes(raw)
          PY
          git apply --check /tmp/v046.patch
          git apply /tmp/v046.patch

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify v0.4.6
        run: |
          python -m compileall -q main.py config.py cogs services storage models data tools
          python -m pytest -q
          python tools/balance_lab.py --quick
          grep -q 'v0.4.6' VERSION.txt
          grep -q 'BOT_VERSION = "0.4.6"' config.py

      - name: Commit clean v0.4.6 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .rr-update
          rm -f .github/workflows/apply-v046.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rat Rod Racing Bot v0.4.6 - Progression, Sponsors & Team Identity'
          git push origin main
