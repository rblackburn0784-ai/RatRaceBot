name: Apply Rat Rod Racing Bot v0.4.3

on:
  push:
    branches: [main]
    paths:
      - '.rr-update/**'
      - '.github/workflows/apply-v043.yml'

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and apply v0.4.3 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          names = ['chunk-000.b64', 'chunk-001.b64']
          paths = [Path('.rr-update') / name for name in names]
          missing = [str(p) for p in paths if not p.exists()]
          if missing:
              raise SystemExit(f'Missing patch chunks: {missing}')
          encoded = ''.join(p.read_text(encoding='utf-8') for p in paths)
          payload = base64.b64decode(encoded, validate=True)
          expected = 'f54722bc52c27ac84461ca89502bfd4445ae28ca340cbe48f2fea7bbbced67c0'
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(f'Compressed patch checksum mismatch: {actual}')
          raw = lzma.decompress(payload)
          raw_expected = 'b10ee9c7bf0efa9730204baa99f393ef822cae4910addeeab7970d6e96829203'
          raw_actual = hashlib.sha256(raw).hexdigest()
          if raw_actual != raw_expected:
              raise SystemExit(f'Raw patch checksum mismatch: {raw_actual}')
          Path('/tmp/v043.patch').write_bytes(raw)
          PY
          git apply --check /tmp/v043.patch
          git apply /tmp/v043.patch

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify v0.4.3
        run: |
          python -m compileall -q main.py config.py cogs services storage models data tools
          python -m pytest -q
          python tools/balance_lab.py --quick

      - name: Commit clean v0.4.3 source
        shell: bash
        run: |
          rm -rf .rr-update
          rm -f .github/workflows/apply-v043.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rat Rod Racing Bot v0.4.3 - Balance & Competitive Integrity'
          git push origin main
